<!doctype html>
<meta charset="utf-8">
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; connect-src https://www.youtube.com https://youtube.com; base-uri 'none'; form-action 'none'"
>
<script>
  (() => {
    "use strict";

    const PLAYER_ENDPOINT =
      "https://www.youtube.com/youtubei/v1/player?key=AIzaSyA8eiZmM1FaDVjRy-df2KTyQ_vz_yYM39w";
    const ANDROID_CLIENT_VERSION = "20.10.38";
    const MAX_PLAYER_BYTES = 2 * 1024 * 1024;
    const MAX_CAPTION_BYTES = 8 * 1024 * 1024;
    const UPSTREAM_TIMEOUT_MS = 20_000;
    const nonce = location.hash.slice(1);
    const ownerOrigin = new URL(location.href).origin;
    const encoder = new TextEncoder();

    function isRecord(value) {
      return typeof value === "object" && value !== null && !Array.isArray(value);
    }

    async function readTextWithLimit(response, maximumBytes) {
      const declaredLength = response.headers.get("Content-Length");
      if (
        declaredLength !== null &&
        (!/^\d+$/.test(declaredLength) ||
          Number(declaredLength) > maximumBytes)
      ) {
        throw new Error("response-too-large");
      }
      if (response.body === null) {
        const text = await response.text();
        if (encoder.encode(text).byteLength > maximumBytes) {
          throw new Error("response-too-large");
        }
        return text;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8", { fatal: true });
      let byteLength = 0;
      let text = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        byteLength += value.byteLength;
        if (byteLength > maximumBytes) {
          await reader.cancel();
          throw new Error("response-too-large");
        }
        text += decoder.decode(value, { stream: true });
      }
      return text + decoder.decode();
    }

    function selectKoreanTrack(player, videoId) {
      const tracks =
        player?.captions?.playerCaptionsTracklistRenderer?.captionTracks;
      if (!Array.isArray(tracks)) return null;
      const selected = tracks
        .filter(
          (track) =>
            isRecord(track) &&
            typeof track.languageCode === "string" &&
            (track.languageCode === "ko" ||
              track.languageCode.startsWith("ko-")) &&
            typeof track.baseUrl === "string",
        )
        .sort((left, right) => {
          const leftAsr = left.kind === "asr" ? 1 : 0;
          const rightAsr = right.kind === "asr" ? 1 : 0;
          return leftAsr - rightAsr;
        })[0];
      if (selected === undefined) return null;
      let url;
      try {
        url = new URL(selected.baseUrl);
      } catch {
        return null;
      }
      if (
        url.protocol !== "https:" ||
        !["www.youtube.com", "youtube.com"].includes(url.hostname) ||
        url.pathname !== "/api/timedtext" ||
        url.username !== "" ||
        url.password !== "" ||
        url.searchParams.get("v") !== videoId
      ) {
        return null;
      }
      url.searchParams.set("fmt", "json3");
      return {
        languageCode: selected.languageCode,
        isAutoGenerated: selected.kind === "asr",
        url: url.toString(),
      };
    }

    function send(requestId, payload) {
      parent.postMessage(
        {
          kind: "exclipper-youtube-caption-result",
          nonce,
          requestId,
          ...payload,
        },
        ownerOrigin,
      );
    }

    addEventListener("message", async (event) => {
      if (
        event.source !== parent ||
        event.origin !== ownerOrigin ||
        !isRecord(event.data) ||
        event.data.kind !== "exclipper-youtube-caption-request" ||
        event.data.nonce !== nonce ||
        typeof event.data.requestId !== "string" ||
        typeof event.data.videoId !== "string" ||
        !/^[A-Za-z0-9_-]{11}$/.test(event.data.videoId)
      ) {
        return;
      }
      const { requestId, videoId } = event.data;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), UPSTREAM_TIMEOUT_MS);
      try {
        const playerResponse = await fetch(PLAYER_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({
            context: {
              client: {
                clientName: "ANDROID",
                clientVersion: ANDROID_CLIENT_VERSION,
                androidSdkVersion: 31,
                hl: "ko",
                gl: "KR",
              },
            },
            videoId,
            contentCheckOk: true,
            racyCheckOk: true,
          }),
          credentials: "omit",
          cache: "no-store",
          referrerPolicy: "no-referrer",
          signal: controller.signal,
        });
        if (!playerResponse.ok) {
          send(requestId, { ok: false, errorCode: "PLAYER_UNAVAILABLE" });
          return;
        }
        const playerText = await readTextWithLimit(
          playerResponse,
          MAX_PLAYER_BYTES,
        );
        const player = JSON.parse(playerText);
        const track = selectKoreanTrack(player, videoId);
        if (track === null) {
          send(requestId, {
            ok: false,
            errorCode:
              player?.playabilityStatus?.status === "OK"
                ? "CAPTIONS_NOT_FOUND"
                : "PLAYER_UNAVAILABLE",
          });
          return;
        }
        const captionResponse = await fetch(track.url, {
          method: "GET",
          credentials: "omit",
          cache: "no-store",
          referrerPolicy: "no-referrer",
          signal: controller.signal,
        });
        if (!captionResponse.ok) {
          send(requestId, { ok: false, errorCode: "CAPTION_UNAVAILABLE" });
          return;
        }
        const captionJson = await readTextWithLimit(
          captionResponse,
          MAX_CAPTION_BYTES,
        );
        const captionPayload = JSON.parse(captionJson);
        if (
          !isRecord(captionPayload) ||
          !Array.isArray(captionPayload.events) ||
          captionPayload.events.length === 0
        ) {
          send(requestId, { ok: false, errorCode: "INVALID_RESPONSE" });
          return;
        }
        send(requestId, {
          ok: true,
          videoId,
          languageCode: track.languageCode,
          isAutoGenerated: track.isAutoGenerated,
          captionJson,
        });
      } catch (error) {
        send(requestId, {
          ok: false,
          errorCode:
            error instanceof DOMException && error.name === "AbortError"
              ? "TIMEOUT"
              : "INVALID_RESPONSE",
        });
      } finally {
        clearTimeout(timeout);
      }
    });

    if (/^[a-f0-9]{32}$/.test(nonce)) {
      parent.postMessage(
        { kind: "exclipper-youtube-caption-ready", nonce },
        ownerOrigin,
      );
    }
  })();
</script>

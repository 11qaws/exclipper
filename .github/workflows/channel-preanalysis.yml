name: Process channel preanalysis queue
run-name: "Prepare channel queue · ${{ inputs.queue_video_ids || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source for an exact retry; leave all for normal refresh"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - amoretto-vods
          - eureka-history
          - sena-replay
          - mangjing-compilations
      video_id:
        description: "Optional exact YouTube video ID; requires a single source"
        required: false
        type: string
      max_videos:
        description: "Maximum due videos to process in this run"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
      force_heavy:
        description: "Force heavy preparation even when preflight finds no due work"
        required: true
        default: true
        type: boolean
      queue_video_ids:
        description: "Validated comma-separated IDs shown in the public queue status"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: channel-preanalysis-heavy-queue
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      catalog_base_sha: ${{ steps.catalog-base.outputs.sha }}
    steps:
      - name: Validate public queue status metadata
        shell: bash
        env:
          QUEUE_VIDEO_IDS: ${{ inputs.queue_video_ids || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${QUEUE_VIDEO_IDS}" && ! "${QUEUE_VIDEO_IDS}" =~ ^[A-Za-z0-9_-]{11}(,[A-Za-z0-9_-]{11}){0,7}$ ]]; then
            echo "::error::Queue display metadata must contain one to eight canonical YouTube IDs."
            exit 1
          fi

      - name: Checkout application source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # workflow_dispatch exposes the immutable commit that selected this
          # workflow as github.sha. Never follow a moving main ref while this
          # secret-bearing job is waiting for a runner.
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require the preanalysis catalog branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin refs/heads/preanalysis-catalog >/dev/null; then
            echo "::error::The preanalysis-catalog branch does not exist. Seed it explicitly before enabling this workflow."
            exit 1
          fi

      - name: Checkout persistent catalog branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: preanalysis-catalog
          path: catalog
          fetch-depth: 1
          persist-credentials: false

      - name: Record catalog base revision
        id: catalog-base
        working-directory: catalog
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap missing configured catalog namespaces
        shell: bash
        run: |
          set -euo pipefail
          namespaces=(
            amoretto-vods
            eureka-history
            sena-replay
            mangjing-compilations
          )
          for namespace in "${namespaces[@]}"; do
            fallback="source/public/preanalysis/${namespace}"
            target="catalog/${namespace}"
            test -f "${fallback}/catalog.json"
            if find "${fallback}" -type l -print -quit | grep -q .; then
              echo "::error::Bundled fallback ${namespace} must not contain symbolic links."
              exit 1
            fi
            if [[ -L "${target}" ]]; then
              echo "::error::Catalog namespace ${namespace} must not be a symbolic link."
              exit 1
            fi
            if [[ -e "${target}" ]]; then
              test -f "${target}/catalog.json"
              continue
            fi
            cp -R -- "${fallback}" "${target}"
          done

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci --ignore-scripts

      - name: Require review-ready Worker credentials
        shell: bash
        env:
          CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL: ${{ secrets.CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL }}
          CHANNEL_PREANALYSIS_CONTEXT_TOKEN: ${{ secrets.CHANNEL_PREANALYSIS_CONTEXT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL}" || -z "${CHANNEL_PREANALYSIS_CONTEXT_TOKEN}" ]]; then
            echo "::error::Review-ready preanalysis requires both CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL and CHANNEL_PREANALYSIS_CONTEXT_TOKEN."
            exit 1
          fi

      - name: Discover uploads and decide whether heavy preparation is due
        id: upload-preflight
        working-directory: source
        shell: bash
        env:
          CATALOG_DIRECTORY: ${{ github.workspace }}/catalog
          SOURCE_ID: ${{ inputs.source || 'all' }}
          MAX_VIDEOS: ${{ inputs.max_videos || '2' }}
          FORCE_HEAVY: ${{ inputs.force_heavy }}
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/channel-preanalysis-upload-preflight.mjs \
            --catalog-dir "${CATALOG_DIRECTORY}" \
            --source "${SOURCE_ID}" \
            --max-videos "${MAX_VIDEOS}"
          heavy_required="$(node --input-type=module - "${CATALOG_DIRECTORY}/channel-preanalysis-upload-preflight-report.json" <<'NODE'
          import { readFile } from "node:fs/promises";

          const report = JSON.parse(await readFile(process.argv[2], "utf8"));
          if (
            report.schemaVersion !== 1 ||
            typeof report.heavyRequired !== "boolean" ||
            !["complete", "partial"].includes(report.status)
          ) {
            console.error("Invalid channel upload preflight report.");
            process.exit(1);
          }
          process.stdout.write(report.heavyRequired ? "true" : "false");
          NODE
          )"
          if [[ "${FORCE_HEAVY}" == "true" ]]; then
            heavy_required="true"
          fi
          echo "heavy_required=${heavy_required}" >> "${GITHUB_OUTPUT}"
          if [[ "${heavy_required}" == "true" ]]; then
            echo "Heavy channel preparation is due."
          else
            echo "RSS and catalogs are current; skipping yt-dlp, WARP, and AI preparation."
          fi

      - name: Verify channel sync and visual fingerprint contracts
        if: steps.upload-preflight.outputs.heavy_required == 'true'
        working-directory: source
        run: >-
          npx --no-install tsx --test
          scripts/channel-preanalysis-upload-preflight.test.mjs
          scripts/channel-preanalysis-visual-fingerprint.test.mjs
          scripts/lib/channel-preanalysis-media.test.mjs
          scripts/lib/channel-preanalysis-scheduled-asr.test.mjs
          scripts/lib/channel-preanalysis-review-checkpoint.test.mjs
          scripts/lib/channel-preanalysis-review-media-adapter.test.mjs
          scripts/lib/channel-preanalysis-review-runner.test.mjs
          scripts/lib/channel-preanalysis-review-publisher.test.mjs
          scripts/lib/channel-preanalysis-review-candidate-client.test.mjs
          scripts/lib/channel-preanalysis-review-job.test.mjs
          scripts/sync-channel-preanalysis-reviews.test.mjs
          scripts/sync-channel-preanalysis.test.mjs
          scripts/sync-amoretto-preanalysis-fingerprint.test.mjs
          scripts/sync-amoretto-preanalysis.test.mjs

      - name: Download and verify pinned yt-dlp
        if: steps.upload-preflight.outputs.heavy_required == 'true'
        shell: bash
        env:
          YT_DLP_VERSION: "2026.07.04"
          YT_DLP_SHA256: "495be29ff4d9d4e9be7eabdfef225221e5d5282e77f2f505abc6dca80349f3fd"
        run: |
          set -euo pipefail
          YT_DLP_PATH="${RUNNER_TEMP}/yt-dlp"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --retry-all-errors \
            --output "${YT_DLP_PATH}" \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/yt-dlp"
          echo "${YT_DLP_SHA256}  ${YT_DLP_PATH}" | sha256sum --check --strict
          chmod 0755 "${YT_DLP_PATH}"
          test "$("${YT_DLP_PATH}" --version)" = "${YT_DLP_VERSION}"

      # YouTube answers this runner's own address with "Sign in to confirm
      # you're not a bot" -- a pure address refusal, not a stale binary: the
      # same pinned yt-dlp and arguments succeed from the editor's network.
      # WARP egress is served, so only yt-dlp is routed through it. The Atom
      # feed already succeeds directly, and Node does not read proxy variables,
      # so the tunnel's blast radius stays limited to the refused path.
      - name: Route YouTube requests through Cloudflare WARP
        if: steps.upload-preflight.outputs.heavy_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cloudflare-warp ffmpeg
          sudo systemctl enable --now warp-svc
          for _ in $(seq 1 20); do
            warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          # Prove the tunnel carries traffic before anything depends on it, so a
          # later refusal cannot be confused with a tunnel that never came up.
          for attempt in $(seq 1 30); do
            if curl -sS --max-time 10 --proxy socks5://127.0.0.1:40000 \
                 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'; then
              echo "WARP egress confirmed after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::WARP never reported warp=on; refusing to fall back to the blocked address."
          exit 1

      - name: Reconcile feed and prepare due transcripts
        if: steps.upload-preflight.outputs.heavy_required == 'true'
        working-directory: source
        shell: bash
        env:
          CATALOG_DIRECTORY: ${{ github.workspace }}/catalog
          YT_DLP_PATH: ${{ runner.temp }}/yt-dlp
          # The child environment allowlist forwards this to yt-dlp and rejects
          # any proxy URL carrying credentials.
          ALL_PROXY: socks5://127.0.0.1:40000
          VIDEO_ID: ${{ inputs.video_id || '' }}
          SOURCE_ID: ${{ inputs.source || 'all' }}
          MAX_VIDEOS: ${{ inputs.max_videos || '2' }}
          CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL: ${{ secrets.CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL }}
          CHANNEL_PREANALYSIS_CONTEXT_TOKEN: ${{ secrets.CHANNEL_PREANALYSIS_CONTEXT_TOKEN }}
        run: |
          set -euo pipefail
          target_catalog_directory="${CATALOG_DIRECTORY}"
          if [[ "${SOURCE_ID}" != "all" ]]; then
            target_catalog_directory="${CATALOG_DIRECTORY}/${SOURCE_ID}"
          fi
          arguments=(
            --catalog-dir "${target_catalog_directory}"
            --yt-dlp "${YT_DLP_PATH}"
            --max-videos "${MAX_VIDEOS}"
            --source "${SOURCE_ID}"
          )
          if [[ -n "${VIDEO_ID}" ]]; then
            if [[ "${SOURCE_ID}" == "all" ]]; then
              echo "::error::An exact video retry requires a single source."
              exit 1
            fi
            arguments+=(--video-id "${VIDEO_ID}")
          fi
          if [[ -n "${CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL}" || -n "${CHANNEL_PREANALYSIS_CONTEXT_TOKEN}" ]]; then
            if [[ -z "${CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL}" || -z "${CHANNEL_PREANALYSIS_CONTEXT_TOKEN}" ]]; then
              echo "::error::Scheduled context analysis requires both dedicated proxy and token secrets."
              exit 1
            fi
            arguments+=(--context-proxy "${CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL}")
          fi
          npx --no-install tsx scripts/sync-amoretto-preanalysis.mjs "${arguments[@]}"

      - name: Prepare complete review-ready bundles
        if: steps.upload-preflight.outputs.heavy_required == 'true'
        working-directory: source
        shell: bash
        env:
          CATALOG_DIRECTORY: ${{ github.workspace }}/catalog
          REVIEW_WORK_DIRECTORY: ${{ runner.temp }}/exclipper-channel-reviews
          YT_DLP_PATH: ${{ runner.temp }}/yt-dlp
          ALL_PROXY: socks5://127.0.0.1:40000
          VIDEO_ID: ${{ inputs.video_id || '' }}
          SOURCE_ID: ${{ inputs.source || 'all' }}
          MAX_VIDEOS: ${{ inputs.max_videos || '2' }}
          CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL: ${{ secrets.CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL }}
          CHANNEL_PREANALYSIS_CONTEXT_TOKEN: ${{ secrets.CHANNEL_PREANALYSIS_CONTEXT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CHANNEL_PREANALYSIS_CONTEXT_PROXY_URL}" || -z "${CHANNEL_PREANALYSIS_CONTEXT_TOKEN}" ]]; then
            echo "::error::Review-ready analysis requires both dedicated proxy and token secrets."
            exit 1
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          arguments=(
            --catalog-dir "${CATALOG_DIRECTORY}"
            --work-dir "${REVIEW_WORK_DIRECTORY}"
            --yt-dlp "${YT_DLP_PATH}"
            --max-videos "${MAX_VIDEOS}"
            --source "${SOURCE_ID}"
          )
          if [[ -n "${VIDEO_ID}" ]]; then
            arguments+=(--video-id "${VIDEO_ID}")
          fi
          npx --no-install tsx scripts/sync-channel-preanalysis-reviews.mjs "${arguments[@]}"

      - name: Upload the verified catalog snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: channel-preanalysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            catalog/channel-preanalysis-upload-preflight-report.json
            catalog/channel-preanalysis-run-report.json
            catalog/channel-preanalysis-review-run-report.json
            catalog/amoretto-vods
            catalog/eureka-history
            catalog/sena-replay
            catalog/mangjing-compilations
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout persistent catalog branch without stored credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: preanalysis-catalog
          path: catalog
          fetch-depth: 1
          persist-credentials: false

      - name: Download the prepared catalog snapshot
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: channel-preanalysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared

      - name: Require the unchanged catalog base
        working-directory: catalog
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.catalog_base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"

      - name: Replace only the four configured catalog namespaces
        shell: bash
        run: |
          set -euo pipefail
          namespaces=(
            amoretto-vods
            eureka-history
            sena-replay
            mangjing-compilations
          )
          for namespace in "${namespaces[@]}"; do
            test -f "prepared/${namespace}/catalog.json"
          done
          if find prepared -type l -print -quit | grep -q .; then
            echo "::error::Prepared catalog must not contain symbolic links."
            exit 1
          fi
          for namespace in "${namespaces[@]}"; do
            mkdir -p "catalog/${namespace}"
            rsync --archive --delete \
              "prepared/${namespace}/" \
              "catalog/${namespace}/"
          done

      - name: Commit and push catalog changes
        working-directory: catalog
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add --all -- \
            amoretto-vods \
            eureka-history \
            sena-replay \
            mangjing-compilations
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): refresh channel preanalysis (${RUN_ID})"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" \
            HEAD:preanalysis-catalog

      - name: Surface partial source failures after preserving healthy updates
        shell: bash
        run: |
          set -euo pipefail
          report="prepared/channel-preanalysis-run-report.json"
          review_report="prepared/channel-preanalysis-review-run-report.json"
          test -f "${report}"
          test -f "${review_report}"
          node --input-type=module - "${report}" "${review_report}" <<'NODE'
          import { readFile } from "node:fs/promises";

          const reportPath = process.argv[2];
          const reviewReportPath = process.argv[3];
          const report = JSON.parse(await readFile(reportPath, "utf8"));
          const reviewReport = JSON.parse(await readFile(reviewReportPath, "utf8"));
          if (
            report.schemaVersion !== 1 ||
            !["complete", "partial"].includes(report.status) ||
            !Array.isArray(report.sourceErrors)
          ) {
            console.error("::error::Channel preanalysis run report is invalid.");
            process.exit(1);
          }
          for (const error of report.sourceErrors) {
            console.error(
              `::error title=Channel preanalysis source failed::${error.sourceId}: ${error.errorCode} ${error.message}`,
            );
          }
          if (report.sourceErrors.length > 0 || report.status !== "complete") {
            console.error(
              "Healthy source updates were preserved and published, but this run is partial.",
            );
            process.exit(1);
          }
          if (
            reviewReport.schemaVersion !== 1 ||
            !["complete", "partial"].includes(reviewReport.status) ||
            !Array.isArray(reviewReport.sourceErrors) ||
            !Array.isArray(reviewReport.reviewErrors)
          ) {
            console.error("::error::Channel review preparation report is invalid.");
            process.exit(1);
          }
          for (const error of reviewReport.sourceErrors) {
            console.error(
              `::error title=Channel review source failed::${error.sourceId}: ${error.errorCode}`,
            );
          }
          for (const error of reviewReport.reviewErrors) {
            console.error(
              `::error title=Channel review preparation incomplete::${error.sourceId}/${error.videoId ?? "unknown"}: ${error.errorCode}`,
            );
          }
          if (
            reviewReport.status === "partial" ||
            reviewReport.sourceErrors.length > 0 ||
            reviewReport.reviewErrors.length > 0
          ) {
            console.error(
              "Review checkpoints were preserved and published, but at least one selected video is not review-ready yet.",
            );
            process.exit(1);
          }
          NODE
